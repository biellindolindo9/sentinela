
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Respawn Centro Médico - Atendimento</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 36px 30px;
      border-radius: 16px;
      box-shadow:
        0 10px 25px -5px rgba(0, 0, 0, 0.08),
        0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo-img {
      width: 100%;
      max-width: 240px;
      height: auto;
      display: block;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background-color: #f8fafc;
      transition: all 0.2s ease;
      color: #334155;
    }

    input:focus,
    select:focus {
      border-color: #0284c7;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    input[type="file"] {
      padding: 10px;
      background-color: #f1f5f9;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-right: 10px;
      transition: background-color 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background-color: #0369a1;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #0284c7;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="container">

  <img
    src="respawn.svg"
    alt="Respawn Centro Médico"
    class="logo-img"
  >

  <h2>Atendimento</h2>

  <input
    id="nome"
    placeholder="Nome"
    autocomplete="name"
  >

  <input
    id="cpf"
    placeholder="CPF"
    autocomplete="off"
  >

  <select id="tipo">
    <option value="Convenio">Convenio</option>
    <option value="Particular">Particular</option>
  </select>

  <input
    type="file"
    id="foto"
    accept="image/*"
  >

  <button id="btnCadastrar" onclick="cadastrar()">
    Cadastrar
  </button>

</div>

<script>

async function cadastrar() {

  const nome = document.getElementById("nome").value.trim();
  const cpf = document.getElementById("cpf").value.trim();
  const tipo = document.getElementById("tipo").value;
  const botao = document.getElementById("btnCadastrar");

  if (!nome) {
    alert("Digite o nome do paciente.");
    return;
  }

  botao.disabled = true;
  botao.textContent = "Cadastrando...";

  try {

    /*
      IMPORTANTE:

      Não usamos mais:
      http://localhost:3000/atendimento

      Usamos uma rota relativa.

      Assim funciona tanto no computador local
      quanto no Render.
    */

    const resposta = await fetch("/atendimento", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nome: nome,
        cpf: cpf,
        tipo: tipo
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(
        dados.erro || "Não foi possível cadastrar o paciente."
      );
    }

    alert(
      "✅ Paciente cadastrado com sucesso!\n\n" +
      nome +
      " foi enviado para a fila de triagem."
    );

    // Limpa o formulário
    document.getElementById("nome").value = "";
    document.getElementById("cpf").value = "";
    document.getElementById("tipo").value = "Convenio";
    document.getElementById("foto").value = "";

  } catch (erro) {

    console.error("Erro ao cadastrar paciente:", erro);

    alert(
      "❌ Não foi possível enviar o paciente para a triagem.\n\n" +
      erro.message
    );

  } finally {

    botao.disabled = false;
    botao.textContent = "Cadastrar";

  }
}

</script>

</body>
</html>
