<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef3f7;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 25px;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .topo h2 {
      margin: 0;
    }

    .btn-tv-abrir {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .consultorio {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .consultorio label {
      font-weight: bold;
    }

    .consultorio input {
      width: 70px;
      margin-left: 8px;
      padding: 8px;
      text-align: center;
      font-weight: bold;
    }

    .atendimento {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      border-left: 5px solid #0284c7;
    }

    .atendimento h3 {
      margin-top: 0;
    }

    .dados-paciente {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .dados-paciente p {
      margin: 7px 0;
    }

    .formulario {
      display: grid;
      gap: 12px;
    }

    .formulario input,
    .formulario textarea,
    .formulario select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    .formulario textarea {
      min-height: 100px;
      resize: vertical;
    }

    .botoes-consulta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .botoes-consulta button {
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-medicar {
      background: #f59e0b;
      color: white;
    }

    .btn-alta {
      background: #16a34a;
      color: white;
    }

    .btn-internar {
      background: #7c3aed;
      color: white;
    }

    .fila-titulo {
      margin-bottom: 15px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .card h3 {
      margin-top: 0;
    }

    .acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .acoes button {
      border: none;
      padding: 9px 13px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-atender {
      background: #0284c7;
      color: white;
    }

    .btn-tv {
      background: #16a34a;
      color: white;
    }

    .btn-alta-fila {
      background: #64748b;
      color: white;
    }

    .risco {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 5px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .vermelho {
      background: #dc2626;
      color: white;
    }

    .amarelo {
      background: #facc15;
      color: #111827;
    }

    .verde {
      background: #16a34a;
      color: white;
    }

    .internacao-form {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
      border-radius: 10px;
    }

    .internacao-form h4 {
      margin-top: 0;
      color: #5b21b6;
    }

    .internacao-form input,
    .internacao-form textarea {
      width: 100%;
      padding: 11px;
      margin-bottom: 10px;
      border: 1px solid #c4b5fd;
      border-radius: 7px;
    }

    .btn-confirmar-internacao {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-cancelar {
      background: #64748b;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 8px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 15px;
      }

      .botoes-consulta button {
        width: 100%;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <div class="topo">

    <h2>🩺 Painel Médico</h2>

    <button
      class="btn-tv-abrir"
      onclick="window.open('tv.html', '_blank')"
    >
      📺 Abrir Tela da TV
    </button>

  </div>

  <div class="consultorio">

    <label>
      Meu Consultório:
    </label>

    <input
      type="text"
      id="consultorio-num"
      value="01"
    >

    <span>
      Número exibido na TV.
    </span>

  </div>


  <!-- ============================================= -->
  <!-- ATENDIMENTO -->
  <!-- ============================================= -->

  <section
    id="areaAtendimento"
    class="atendimento"
    style="display:none;"
  >

    <h3>
      🩺 Atendimento do paciente
    </h3>

    <div class="dados-paciente">

      <p>
        <b>Paciente:</b>
        <span id="nomePaciente">-</span>
      </p>

      <p>
        <b>Temperatura:</b>
        <span id="temperaturaPaciente">-</span>
      </p>

      <p>
        <b>Risco:</b>
        <span id="riscoPaciente">-</span>
      </p>

      <p>
        <b>Alergia:</b>
        <span id="alergiaPaciente">-</span>
      </p>

      <p>
        <b>Sintoma:</b>
        <span id="sintomaPaciente">-</span>
      </p>

      <p>
        <b>Observação da triagem:</b>
        <span id="observacaoTriagem">-</span>
      </p>

    </div>


    <div class="formulario">

      <input
        type="text"
        id="diagnostico"
        placeholder="Diagnóstico / avaliação médica"
      >

      <textarea
        id="obs"
        placeholder="Observações e atendimento realizado"
      ></textarea>

      <select id="medicacao">

        <option value="">
          Nenhuma medicação hospitalar
        </option>

      </select>

    </div>


    <div class="botoes-consulta">

      <button
        class="btn-medicar"
        onclick="mandarParaMedicacao()"
      >
        💊 Mandar para sala de medicações
      </button>

      <button
        class="btn-alta"
        onclick="darAlta()"
      >
        ✅ Dar alta
      </button>

      <button
        class="btn-internar"
        onclick="mostrarInternacao()"
      >
        🏥 Internar paciente
      </button>

    </div>


    <!-- FORMULÁRIO DE INTERNAÇÃO -->

    <div
      id="internacaoForm"
      class="internacao-form"
    >

      <h4>
        🏥 Dados da internação
      </h4>

      <input
        type="text"
        id="quarto"
        placeholder="Quarto"
      >

      <input
        type="text"
        id="leito"
        placeholder="Leito"
      >

      <input
        type="text"
        id="motivoInternacao"
        placeholder="Motivo da internação"
      >

      <textarea
        id="observacaoInternacao"
        placeholder="Observações para a internação"
      ></textarea>

      <button
        class="btn-confirmar-internacao"
        onclick="confirmarInternacao()"
      >
        Confirmar internação
      </button>

      <button
        class="btn-cancelar"
        onclick="cancelarInternacao()"
      >
        Cancelar
      </button>

    </div>

  </section>


  <!-- ============================================= -->
  <!-- FILA -->
  <!-- ============================================= -->

  <h3 class="fila-titulo">
    👨‍⚕️ Pacientes aguardando atendimento
  </h3>

  <div id="triagens">

  </div>

</div>


<script>

let triagensCarregadas = [];
let pacienteSelecionado = null;


// ==================================================
// CARREGAR FILA
// ==================================================

function carregar() {

  fetch("/triagens")
    .then(response => response.json())
    .then(data => {

      triagensCarregadas = data;

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";

      const pacientesVisiveis =
        data.filter(t =>
          !pacienteSelecionado ||
          t.id !== pacienteSelecionado.id
        );

      if (pacientesVisiveis.length === 0) {

        div.innerHTML =
          "<p style='color:#888;text-align:center;'>Nenhum paciente aguardando atendimento.</p>";

        return;
      }

      pacientesVisiveis.forEach(t => {

        const index =
          triagensCarregadas.indexOf(t);

        div.innerHTML += `

          <div class="card">

            <h3>${t.nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <b>Risco:</b>
              <span class="risco ${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <div class="acoes">

              <button
                class="btn-atender"
                onclick="selecionar(${index})"
              >
                🩺 Atender
              </button>

              <button
                class="btn-tv"
                onclick="chamarNaTV('${escapar(t.nome)}')"
              >
                📺 Chamar na TV
              </button>

              <button
                class="btn-alta-fila"
                onclick="darAltaDireta('${escapar(t.nome)}')"
              >
                ✅ Dar alta
              </button>

            </div>

          </div>

        `;

      });

    })
    .catch(error => {

      console.error(error);

    });

}


// ==================================================
// SELECIONAR PACIENTE
// ==================================================

function selecionar(index) {

  const t =
    triagensCarregadas[index];

  if (!t) return;

  pacienteSelecionado = t;

  document.getElementById("areaAtendimento").style.display =
    "block";

  document.getElementById("nomePaciente").textContent =
    t.nome || "-";

  document.getElementById("temperaturaPaciente").textContent =
    t.temperatura
      ? t.temperatura + "°C"
      : "Não informada";

  document.getElementById("riscoPaciente").textContent =
    t.risco || "-";

  document.getElementById("alergiaPaciente").textContent =
    t.alergia || "Nenhuma";

  document.getElementById("sintomaPaciente").textContent =
    t.sintoma || "Não informado";

  document.getElementById("observacaoTriagem").textContent =
    t.observacao || "Nenhuma";

  document.getElementById("diagnostico").value =
    "";

  document.getElementById("obs").value =
    t.observacao || "";

  document.getElementById("medicacao").value =
    "";

  document.getElementById("internacaoForm").style.display =
    "none";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  carregar();

}


// ==================================================
// MEDICAÇÕES
// ==================================================

function carregarMedicacoes() {

  fetch("/lista-medicacoes")
    .then(response => response.json())
    .then(data => {

      const select =
        document.getElementById("medicacao");

      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    });

}


// ==================================================
// MANDAR PARA MEDICAÇÃO
// ==================================================

function mandarParaMedicacao() {

  if (!pacienteSelecionado) {

    alert("Selecione um paciente.");

    return;
  }

  const medicacao =
    document.getElementById("medicacao").value;

  if (!medicacao) {

    alert(
      "Selecione uma medicação hospitalar antes de enviar para a sala de medicações."
    );

    return;
  }

  salvarConsulta("medicacao");

}


// ==================================================
// DAR ALTA
// ==================================================

function darAlta() {

  if (!pacienteSelecionado) {

    alert("Selecione um paciente.");

    return;
  }

  const medicacao =
    document.getElementById("medicacao").value;

  if (medicacao) {

    alert(
      "Este paciente possui uma medicação hospitalar selecionada. Ele deve passar pela sala de medicações antes da alta."
    );

    return;
  }

  salvarConsulta("alta");

}


// ==================================================
// DAR ALTA DIRETA PELA FILA
// ==================================================

function darAltaDireta(nome) {

  if (
    !confirm(
      `Deseja realmente dar alta para ${nome}?`
    )
  ) {
    return;
  }

  fetch("/alta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      paciente: nome
    })

  })
  .then(response => response.json())
  .then(() => {

    window.location.href =
      "alta.html?paciente=" +
      encodeURIComponent(nome);

  });

}


// ==================================================
// SALVAR CONSULTA
// ==================================================

function salvarConsulta(tipoDestino) {

  const paciente =
    pacienteSelecionado.nome;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs,
      tipoDestino

    })

  })
  .then(response => response.json())
  .then(() => {

    if (tipoDestino === "medicacao") {

      window.location.href =
        "medicacoes.html?paciente=" +
        encodeURIComponent(paciente);

      return;

    }

    if (tipoDestino === "alta") {

      window.location.href =
        "alta.html?paciente=" +
        encodeURIComponent(paciente);

    }

  });

}


// ==================================================
// MOSTRAR FORMULÁRIO DE INTERNAÇÃO
// ==================================================

function mostrarInternacao() {

  if (!pacienteSelecionado) {

    alert("Selecione um paciente.");

    return;
  }

  document.getElementById(
    "internacaoForm"
  ).style.display = "block";

}


// ==================================================
// CANCELAR INTERNAÇÃO
// ==================================================

function cancelarInternacao() {

  document.getElementById(
    "internacaoForm"
  ).style.display = "none";

}


// ==================================================
// CONFIRMAR INTERNAÇÃO
// ==================================================

function confirmarInternacao() {

  if (!pacienteSelecionado) {

    alert("Selecione um paciente.");

    return;
  }

  const quarto =
    document.getElementById("quarto").value;

  const leito =
    document.getElementById("leito").value;

  const motivo =
    document.getElementById("motivoInternacao").value;

  const observacao =
    document.getElementById("observacaoInternacao").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;


  if (!quarto || !leito || !motivo) {

    alert(
      "Informe o quarto, leito e motivo da internação."
    );

    return;
  }


  fetch("/internacoes", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente: pacienteSelecionado.nome,

      quarto,

      leito,

      motivo,

      diagnostico,

      observacao,

      medicacao

    })

  })
  .then(response => response.json())
  .then(() => {

    alert(
      "Paciente internado com sucesso."
    );

    window.location.href =
      "internacao.html";

  });

}


// ==================================================
// CHAMAR NA TV
// ==================================================

function chamarNaTV(nome) {

  const consultorio =
    document.getElementById(
      "consultorio-num"
    ).value || "01";

  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "CONSULTÓRIO",

      localNumero: consultorio,

      paciente: nome

    })

  })
  .then(response => response.json())
  .then(() => {

    alert(
      "✅ " +
      nome +
      " foi chamado na TV para o Consultório " +
      consultorio +
      "!"
    );

  });

}


// ==================================================
// SEGURANÇA PARA NOMES
// ==================================================

function escapar(texto) {

  return String(texto)
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");

}


// ==================================================
// INICIAR
// ==================================================

carregar();

carregarMedicacoes();

setInterval(carregar, 10000);

</script>

</body>

</html>
