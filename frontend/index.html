<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Respawn Centro Médico - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 36px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo-img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background-color: #f8fafc;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #0284c7;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #0284c7;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:active {
      transform: scale(0.99);
    }

    .slogan {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .highlight-six-seven {
      color: #0284c7;
      font-weight: 800;
      text-transform: uppercase;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

<div class="container">
  <img src="respawn.svg" alt="Respawn Centro Médico" class="logo-img">
  <h2>Acesso ao Sistema</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<p class="slogan">não farmamos aura, farmamos vidas, muito mais que <span class="highlight-six-seven">six seven</span>.</p>

<script>
function login() {
  fetch("http://localhost:3000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })
  })
  .then(r => r.json())
  .then(data => {
    if(data.tipo === "triagem") location.href = "triagem.html";
    if(data.tipo === "medico") location.href = "medico.html";
    if(data.tipo === "atendimento") location.href = "atendimento.html";
  });
}
</script>
</body>
</html>
